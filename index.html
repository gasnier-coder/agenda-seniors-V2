<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Seniors - Vue Semaine</title>
    <!-- Liens PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <style>
        :root {
            --bg-color: #000000; /* Noir pur */
            --card-bg: #121212;
            --text-main: #ffffff;
            --accent-green: #00ff87;
            --accent-red: #C92808; /* Ton rouge exact */
            --accent-blue: #00d2ff;
            --text-sub: #b0b0b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Bloque le scroll global & Zéro marge en haut */
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            padding: 0 15px 15px 15px;
        }

        /* En-tête collé en haut avec grand logo */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent-red);
            padding: 5px 0 10px 0;
            margin-bottom: 12px;
            height: 115px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Logo */
        .logo-container {
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Titre de la semaine en rouge */
        .header-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent-red);
            text-transform: capitalize;
            letter-spacing: 0.5px;
        }

        /* Grille réglée sur 6 colonnes (Lundi -> Vendredi + Week-end) */
        .week-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            flex-grow: 1;
            height: calc(100vh - 220px);
            overflow: hidden;
        }

        /* Colonne d'un jour standard */
        .day-column {
            background: #0a0a0a;
            border-radius: 10px;
            padding: 10px;
            border: 2px solid #222;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Colonne double pour le Week-end (Samedi + Dimanche empilés) */
        .weekend-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            overflow: hidden;
        }

        .weekend-day {
            flex: 1;
            background: #0a0a0a;
            border-radius: 10px;
            padding: 8px 10px;
            border: 2px solid #222;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .day-column.is-today, .weekend-day.is-today {
            border-color: var(--accent-green);
            background: #0d1a12;
        }

        .day-header {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-green);
            border-bottom: 2px solid #222;
            padding-bottom: 4px;
            margin-bottom: 8px;
            text-align: center;
            text-transform: capitalize;
            flex-shrink: 0;
        }

        .day-column.is-today .day-header, .weekend-day.is-today .day-header {
            color: #00ffff;
        }

        /* Liste des RDV dans la colonne */
        .rdv-list-day {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
            overflow-y: auto;
        }

        /* Carte de RDV avec boutons en bas à droite */
        .rdv-card {
            background-color: var(--card-bg);
            border-left: 5px solid var(--accent-green);
            border-radius: 6px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            position: relative;
        }

        .rdv-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }

        /* Ligne 1 : Heure + Titre */
        .rdv-line-1 {
            font-size: 1.15rem;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .rdv-heure {
            color: var(--accent-green);
            background: #15291d;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 1.05rem;
            white-space: nowrap;
        }

        /* Ligne 2 : Détails */
        .rdv-line-2 {
            font-size: 0.95rem;
            color: var(--text-sub);
            word-break: break-word;
            margin-bottom: 20px;
        }

        /* Actions alignées en bas à droite */
        .rdv-actions {
            position: absolute;
            bottom: 4px;
            right: 6px;
            display: flex;
            gap: 4px;
        }

        .btn-action {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            font-size: 0.85rem;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-edit {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn-edit:hover {
            background: var(--accent-blue);
            color: #000;
        }

        .btn-delete {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .btn-delete:hover {
            background: var(--accent-red);
            color: #fff;
        }

        .no-rdv {
            font-size: 1rem;
            color: #444;
            text-align: center;
            margin-top: 10px;
            font-style: italic;
        }

        /* Barre de Navigation Géante en Bas */
        .nav-footer {
            height: 70px;
            flex-shrink: 0;
            display: flex;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .btn-nav-large {
            flex: 2;
            height: 100%;
            background: #15291d;
            color: var(--accent-green);
            border: 3px solid var(--accent-green);
            font-size: 1.8rem;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .btn-nav-large:hover {
            background: var(--accent-green);
            color: #000;
        }

        .btn-today {
            flex: 1;
            height: 100%;
            background: #151515;
            color: #fff;
            border: 2px solid #444;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }

        .btn-today:hover {
            background: #333;
        }

        /* Panneau Saisie / Modif Famille Protégé */
        .admin-section {
            flex-shrink: 0;
        }

        .admin-toggle {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 5px;
        }

        .form-admin {
            display: none;
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #0a0a0a;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--accent-red);
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            z-index: 100;
        }

        .form-admin.active {
            display: grid;
        }

        .form-header {
            grid-column: span 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .form-title {
            color: var(--accent-red);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .btn-close-form {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            color: var(--accent-green);
            font-weight: bold;
            font-size: 1rem;
        }

        input {
            background: #151515;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 12px;
            font-size: 1.1rem;
            border-radius: 6px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .btn-add {
            grid-column: span 2;
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo-container">
                <img src="ton-logo.png" alt="Logo">
            </div>
            <div class="header-title" id="week-title">Semaine...</div>
        </div>
    </header>

    <main class="week-grid" id="week-grid">
        <!-- Généré dynamiquement -->
    </main>

    <!-- Navigation Géante en Bas -->
    <div class="nav-footer">
        <button class="btn-nav-large" onclick="changerSemaine(-1)">
            ◀ Semaine Précédente
        </button>
        <button class="btn-today" onclick="allerAujourdhui()">Aujourd'hui</button>
        <button class="btn-nav-large" onclick="changerSemaine(1)">
            Semaine Suivante ▶
        </button>
    </div>

    <!-- Saisie Admin Protégée par Mot de Passe -->
    <div class="admin-section">
        <button class="admin-toggle" onclick="verifierMotDePasse()">⚙️ + Ajouter un rendez-vous (Famille)</button>

        <form class="form-admin" id="admin-form" onsubmit="sauvegarderRDV(event)">
            <input type="hidden" id="rdv-id">
            <div class="form-header">
                <span class="form-title" id="form-title">Ajouter un rendez-vous</span>
                <button type="button" class="btn-close-form" onclick="fermerFormulaire()">✕</button>
            </div>
            <div class="form-group">
                <label for="rdv-date">Date :</label>
                <input type="date" id="rdv-date" required>
            </div>
            <div class="form-group">
                <label for="rdv-heure">Heure (ex: 14h30) :</label>
                <input type="text" id="rdv-heure" placeholder="14h30" required>
            </div>
            <div class="form-group full-width">
                <label for="rdv-titre">Ligne 1 - Intitulé principal :</label>
                <input type="text" id="rdv-titre" placeholder="Kiné, Docteur Martin..." required>
            </div>
            <div class="form-group full-width">
                <label for="rdv-detail">Ligne 2 - Détails / Consignes :</label>
                <input type="text" id="rdv-detail" placeholder="Prendre la carte Vitale...">
            </div>
            <button type="submit" class="btn-add" id="btn-submit">Enregistrer</button>
        </form>
    </div>

    <!-- SDK Firebase Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // --- REMPLACE CET OBJET PAR TION PROPRE CONFIGURATION FIREBASE ---
 const firebaseConfig = {
    apiKey: "AIzaSyC6Tw3guUVkXFj-rT6y8klAB-CVn6KWCRQ",
    authDomain: "agenda-seniors-v2.firebaseapp.com",
    databaseURL: "https://agenda-seniors-v2-default-rtdb.firebaseio.com",
    projectId: "agenda-seniors-v2",
    storageBucket: "agenda-seniors-v2.firebasestorage.app",
    messagingSenderId: "333800206112",
    appId: "1:333800206112:web:48ec80f92666ec13487145"
};

        // Initialisation de Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const rdvRef = ref(db, 'rendezvous');

        const FAMILLE_PASSWORD = '324'; // Ton code PIN famille
        let dateReference = new Date();
        let cacheRDVs = [];

        // Écoute en temps réel : dès qu'un RDV est ajouté/modifié en ligne, cet écran se rafraîchit seul !
        onValue(rdvRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                cacheRDVs = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                }));
            } else {
                cacheRDVs = [];
            }
            renderSemaine();
        });

        function getLundi(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        function formatISO(d) {
            return d.toISOString().split('T')[0];
        }

        window.changerSemaine = function(offset) {
            dateReference.setDate(dateReference.getDate() + (offset * 7));
            renderSemaine();
        };

        window.allerAujourdhui = function() {
            dateReference = new Date();
            renderSemaine();
        };

        window.verifierMotDePasse = function() {
            const mdp = prompt("Entrez le mot de passe famille :");
            if (mdp === FAMILLE_PASSWORD) {
                ouvrirFormulaireAjout();
            } else if (mdp !== null) {
                alert("Mot de passe incorrect !");
            }
        };

        window.editerRDVProtege = function(id) {
            const mdp = prompt("Entrez le mot de passe famille pour modifier :");
            if (mdp === FAMILLE_PASSWORD) {
                editerRDV(id);
            } else if (mdp !== null) {
                alert("Mot de passe incorrect !");
            }
        };

        window.supprimerRDVProtege = function(id) {
            const mdp = prompt("Entrez le mot de passe famille pour supprimer :");
            if (mdp === FAMILLE_PASSWORD) {
                supprimerRDV(id);
            } else if (mdp !== null) {
                alert("Mot de passe incorrect !");
            }
        };

        function genererHTMLJour(nomJour, jourCourant, rdvsDuJour, isToday) {
            let html = `
                <div class="day-header">
                    ${nomJour} ${jourCourant.getDate()}
                </div>
                <div class="rdv-list-day">
            `;

            if (rdvsDuJour.length === 0) {
                html += `<div class="no-rdv">-</div>`;
            } else {
                rdvsDuJour.forEach(rdv => {
                    html += `
                        <div class="rdv-card">
                            <div class="rdv-info">
                                <div class="rdv-line-1">
                                    <span class="rdv-heure">${escapeHtml(rdv.heure)}</span>
                                    <span>${escapeHtml(rdv.titre)}</span>
                                </div>
                                <div class="rdv-line-2">
                                    ${rdv.detail ? escapeHtml(rdv.detail) : ''}
                                </div>
                            </div>
                            <div class="rdv-actions">
                                <button class="btn-action btn-edit" onclick="editerRDVProtege('${rdv.id}')">✏️</button>
                                <button class="btn-action btn-delete" onclick="supprimerRDVProtege('${rdv.id}')">✕</button>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            return html;
        }

        function renderSemaine() {
            const lundi = getLundi(dateReference);
            const dimanche = new Date(lundi);
            dimanche.setDate(lundi.getDate() + 6);

            const optMonth = { day: 'numeric', month: 'short' };
            const titreSemaine = `Semaine du ${lundi.toLocaleDateString('fr-FR', optMonth)} au ${dimanche.toLocaleDateString('fr-FR', optMonth)} ${dimanche.getFullYear()}`;
            document.getElementById('week-title').textContent = titreSemaine;

            const gridContainer = document.getElementById('week-grid');
            gridContainer.innerHTML = '';

            const todayISO = formatISO(new Date());
            const nomsJours = ['Lun.', 'Mar.', 'Mer.', 'Jeu.', 'Ven.', 'Sam.', 'Dim.'];

            for (let i = 0; i < 5; i++) {
                const jourCourant = new Date(lundi);
                jourCourant.setDate(lundi.getDate() + i);
                const jourISO = formatISO(jourCourant);
                const isToday = jourISO === todayISO;

                const rdvsDuJour = cacheRDVs.filter(r => r.date === jourISO);
                rdvsDuJour.sort((a, b) => a.heure.localeCompare(b.heure));

                const column = document.createElement('div');
                column.className = `day-column ${isToday ? 'is-today' : ''}`;
                column.innerHTML = genererHTMLJour(nomsJours[i], jourCourant, rdvsDuJour, isToday);
                gridContainer.appendChild(column);
            }

            const weekendCol = document.createElement('div');
            weekendCol.className = 'weekend-column';

            const samedi = new Date(lundi);
            samedi.setDate(lundi.getDate() + 5);
            const samISO = formatISO(samedi);
            const isSamToday = samISO === todayISO;
            const rdvsSamedi = cacheRDVs.filter(r => r.date === samISO);
            rdvsSamedi.sort((a, b) => a.heure.localeCompare(b.heure));

            const samDiv = document.createElement('div');
            samDiv.className = `weekend-day ${isSamToday ? 'is-today' : ''}`;
            samDiv.innerHTML = genererHTMLJour('Sam.', samedi, rdvsSamedi, isSamToday);

            const dimISO = formatISO(dimanche);
            const isDimToday = dimISO === todayISO;
            const rdvsDimanche = cacheRDVs.filter(r => r.date === dimISO);
            rdvsDimanche.sort((a, b) => a.heure.localeCompare(b.heure));

            const dimDiv = document.createElement('div');
            dimDiv.className = `weekend-day ${isDimToday ? 'is-today' : ''}`;
            dimDiv.innerHTML = genererHTMLJour('Dim.', dimanche, rdvsDimanche, isDimToday);

            weekendCol.appendChild(samDiv);
            weekendCol.appendChild(dimDiv);
            gridContainer.appendChild(weekendCol);
        }

        function ouvrirFormulaireAjout() {
            document.getElementById('rdv-id').value = '';
            document.getElementById('form-title').textContent = 'Ajouter un rendez-vous';
            document.getElementById('btn-submit').textContent = 'Enregistrer';
            document.getElementById('rdv-heure').value = '';
            document.getElementById('rdv-titre').value = '';
            document.getElementById('rdv-detail').value = '';
            document.getElementById('rdv-date').value = formatISO(new Date());
            document.getElementById('admin-form').classList.add('active');
        }

        function editerRDV(id) {
            const rdv = cacheRDVs.find(r => r.id === id);
            if (!rdv) return;

            document.getElementById('rdv-id').value = rdv.id;
            document.getElementById('rdv-date').value = rdv.date;
            document.getElementById('rdv-heure').value = rdv.heure;
            document.getElementById('rdv-titre').value = rdv.titre;
            document.getElementById('rdv-detail').value = rdv.detail || '';

            document.getElementById('form-title').textContent = 'Modifier le rendez-vous';
            document.getElementById('btn-submit').textContent = 'Mettre à jour';
            document.getElementById('admin-form').classList.add('active');
        }

        window.fermerFormulaire = function() {
            document.getElementById('admin-form').classList.remove('active');
        };

        window.sauvegarderRDV = function(e) {
            e.preventDefault();
            const id = document.getElementById('rdv-id').value || Date.now().toString();
            const date = document.getElementById('rdv-date').value;
            const heure = document.getElementById('rdv-heure').value;
            const titre = document.getElementById('rdv-titre').value;
            const detail = document.getElementById('rdv-detail').value;

            // Sauvegarde directe sur le cloud Firebase
            set(ref(db, 'rendezvous/' + id), {
                date,
                heure,
                titre,
                detail
            }).then(() => {
                fermerFormulaire();
            }).catch(err => {
                alert("Erreur d'enregistrement Firebase : " + err.message);
            });
        };

        function supprimerRDV(id) {
            if (confirm("Supprimer ce rendez-vous ?")) {
                remove(ref(db, 'rendezvous/' + id));
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>
</body>
</html>
